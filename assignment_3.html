<html>
<head>
    <title>Block and Inline</title>
    <style>
        .block {
            background-color: lightblue;
            margin: 5px ;
        }
        .inline {
            background-color: lightgreen;
        }
    </style>
</head>

<body>
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    <span class="inline">Inline 1</span>

    <span class="inline">Inline 3</span>
</body>
</html>
